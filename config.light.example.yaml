# Лёгкий профиль: меньше CPU (~15–30% одного ядра вместо 80–100%).
# Скопируйте в config.light.yaml и подставьте camera/telegram из config.yaml:
#   copy config.light.example.yaml config.light.yaml
# Запуск:
#   python watch.py --config config.light.yaml

camera:
  host: ""
  onvif_port: null
  username: admin
  password: ""
  # Substream 102 — меньше разрешение, быстрее декод (если нет потока — верните Channels/101)
  rtsp_url: rtsp://USER:PASS@HOST:8554/Streaming/Channels/102

detection:
  yolo_model: yolo11n.pt
  cat_confidence: 0.15
  couch_confidence: 0.08
  bed_confidence: 0.06
  furniture_classes: [couch, bed]
  use_world_model: false
  inference_width: 640
  enhance_contrast: false
  fluffy_margin: 0.15
  cat_roi_enabled: true
  cat_roi_padding: 0.08
  furniture_check_seconds: 2
  bed_zone:
    source: yolo
    expand_bbox: true
    bbox_grow_ratio: 0.12
    headboard_lift_ratio: 0.72
    headboard_up_ratio: 1.15
    pad_down_ratio: 0.12
    pad_x_ratio: 0.02
    wall_top_percent: 38
    hold_seconds: 30
    check_interval_seconds: 2

motion:
  alert_mode: hybrid
  threshold: 22
  min_blob_area: 1200
  max_blob_area: 200000
  min_bed_overlap: 0.35
  warmup_frames: 25
  erode_iter: 1
  dilate_iter: 2
  stable_frames: 2
  min_cat_motion_overlap: 0.10
  cat_on_bed_overlap: 0.15
  cat_lock:
    enabled: true
    release_frames: 8
    grace_frames: 2
    match_iou: 0.15
    max_center_drift: 180
  pixel_overlay_alpha: 0.5
  suppress_if_person: true
  person_check_seconds: 15

runtime:
  show_preview: true
  preview_max_width: 640
  preview_fps: 5
  rtsp_flush_grabs: 3
  save_snapshots: true
  snapshot_dir: snapshots

alert:
  cooldown_seconds: 10
  beep: true
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
